<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>令和8年熊本地震 被災状況</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 8px; color: #1f2937; font-size: 13px; line-height: 1.45; }
    h1 { margin: 0 0 8px; font-size: 17px; }
    h2 { margin: 10px 0 5px; font-size: 14px; }
    label { display: block; margin: 6px 0; }
    select, button, input { font: inherit; }
    select { width: 100%; min-height: 30px; }
    .status { min-height: 1.5em; margin: 7px 0; padding: 6px 8px; border-left: 4px solid #2563eb; background: #eff6ff; }
    .status.error { border-color: #b91c1c; background: #fef2f2; color: #7f1d1d; }
    .notice { padding: 7px 9px; background: #f8fafc; border-left: 3px solid #64748b; font-size: 11px; }
    .legend { display: grid; grid-template-columns: 18px 1fr; gap: 5px 7px; align-items: center; }
    .swatch { width: 16px; height: 12px; border: 1px solid #111827; }
    a { color: #075ea8; }
  </style>
  <script src="https://cdn.jsdelivr.net/gh/svgmap/svgmapjs@latest/svgMapLayerLib.js"></script>
  <script type="module" src="./r8KumamotoGsiDamage.js"></script>
</head>
<body>
  <h1>正射画像・斜面崩壊</h1>
  <label for="orthoSelect">正射画像</label>
  <select id="orthoSelect">
    <option value="ortho-kumamoto3">熊本3地区（7/31・8/1撮影）</option>
    <option value="ortho-yatsushiro">八代地区（7/29撮影）</option>
    <option value="">表示しない</option>
  </select>
  <label><input id="slopeYatsushiroToggle" type="checkbox" checked> 斜面崩壊・堆積（八代地区）</label>
  <label><input id="slopeKumamoto3Toggle" type="checkbox" checked> 斜面崩壊・堆積（熊本3地区）</label>
  <label for="opacityRange">正射画像の不透明度 <output id="opacityValue">80%</output></label>
  <input id="opacityRange" type="range" min="0" max="100" value="80">
  <button id="reloadButton" type="button">斜面データを再取得</button>
  <div id="statusMessage" class="status" role="status" aria-live="polite">初期化待ち</div>
  <h2>凡例</h2>
  <div class="legend">
    <span class="swatch" style="background:#ff323280;border-color:#f00"></span><span>斜面崩壊・堆積（八代地区）</span>
    <span class="swatch" style="background:transparent;border-color:#000"></span><span>判読範囲・斜面崩壊等（熊本3地区）</span>
  </div>
  <p class="notice">出典：<a href="https://www.gsi.go.jp/BOUSAI/20260728_kumamoto_earthquake.html" target="_blank" rel="noopener noreferrer">国土地理院「令和8年熊本地震に関する情報」</a>。現地調査を伴わない空中写真判読のため、未抽出・誤抽出の可能性があります。正射画像には歪みや不連続が生じる場合があります。</p>
</body>
</html>
